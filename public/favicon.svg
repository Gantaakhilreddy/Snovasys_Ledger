<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />

  <!-- Ledger Columns & Vault Arch -->
  <path d="M7 11.5L16 6.5L25 11.5V13H7V11.5Z" fill="#F8FAFC" />
  <circle cx="16" cy="9.8" r="1.3" fill="url(#accentGradient)" />

  <!-- Three Columns of Banking Solvency -->
  <rect x="9" y="14" width="2.4" height="8" rx="0.8" fill="#F8FAFC" />
  <rect x="14.8" y="14" width="2.4" height="8" rx="0.8" fill="url(#accentGradient)" filter="url(#glow)" />
  <rect x="20.6" y="14" width="2.4" height="8" rx="0.8" fill="#F8FAFC" />

  <!-- Base Pedestal -->
  <rect x="7" y="22.5" width="18" height="2" rx="0.6" fill="#F8FAFC" />
  <rect x="5.5" y="24.8" width="21" height="1.8" rx="0.6" fill="url(#accentGradient)" />
</svg>

